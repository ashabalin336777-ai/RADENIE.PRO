services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: radenie
      POSTGRES_PASSWORD: radenie_secret
      POSTGRES_DB: radenie_pro
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - radenie
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radenie -d radenie_pro"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Backend
    env_file:
      - .env
    environment:
      PORT: "4000"
      DATABASE_URL: postgresql://radenie:radenie_secret@postgres:5432/radenie_pro
      ALLOW_ADMIN_RESET: ${ALLOW_ADMIN_RESET:-0}
      ADMIN_RESET_TOKEN: ${ADMIN_RESET_TOKEN:-}
    restart: unless-stopped
    networks:
      - radenie
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    build:
      context: ./Frontend
    env_file:
      - .env
    environment:
      PORT: "3000"
      DATABASE_URL: postgresql://radenie:radenie_secret@postgres:5432/radenie_pro?connect_timeout=5
      # Публичный URL сайта (НЕ localhost). Для VPS: http://radenie.pro
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://radenie.pro}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-${SESSION_SECRET:-radenie-change-me-in-production-min-32}}
      # Аварийный сброс: ALLOW_ADMIN_RESET=1 + ADMIN_RESET_TOKEN=...
      ALLOW_ADMIN_RESET: ${ALLOW_ADMIN_RESET:-0}
      ADMIN_RESET_TOKEN: ${ADMIN_RESET_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped
    networks:
      - radenie

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${PUBLIC_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - radenie

networks:
  radenie:
    driver: bridge

volumes:
  postgres_data:
