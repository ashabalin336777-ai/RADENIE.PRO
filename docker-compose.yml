services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: radenie
      POSTGRES_PASSWORD: radenie_secret
      POSTGRES_DB: radenie_pro
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - radenie
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radenie -d radenie_pro"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Backend
    env_file:
      - .env
    environment:
      PORT: "4000"
    restart: unless-stopped
    networks:
      - radenie

  frontend:
    build:
      context: ./Frontend
    env_file:
      - .env
    environment:
      PORT: "3000"
      DATABASE_URL: postgresql://radenie:radenie_secret@postgres:5432/radenie_pro
      NEXTAUTH_URL: http://localhost:${PUBLIC_PORT:-8080}
      NEXTAUTH_SECRET: ${SESSION_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped
    networks:
      - radenie

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${PUBLIC_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - radenie

networks:
  radenie:
    driver: bridge

volumes:
  postgres_data:
